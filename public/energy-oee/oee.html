let dataList = JSON.parse(localStorage.getItem('oeeDeviceData')) || JSON.parse(JSON.stringify(initDeviceList));

// OEE核心计算
function calcSingle(item){
    const plan = Number(item.planHour)||0;
    const run = Number(item.runningHour)||0;
    const total = Number(item.total)||0;
    const good = Number(item.good)||0;
    const takt = Number(item.takt)||1;

    const avail = plan>0 ? run/plan : 0;
    const theoryOut = run * 3600 / takt;
    const perf = theoryOut>0 ? total / theoryOut : 0;
    const qual = total>0 ? good / total : 0;
    const oee = avail * perf * qual;

    return {
        availRate: (avail*100).toFixed(2)+"%",
        perfRate: (perf*100).toFixed(2)+"%",
        qualRate: (qual*100).toFixed(2)+"%",
        oeeVal: (oee*100).toFixed(2),
        oeePercent: (oee*100).toFixed(2)+"%"
    }
}

// 获取OEE文字颜色
function getOeeClass(val){
    let v = Number(val);
    if(v >= 85) return "rate-excellent";
    if(v >=70) return "rate-good";
    if(v >=60) return "rate-normal";
    return "rate-bad";
}

// 渲染表格+统计面板
function renderTable(){
    const wsKey = document.getElementById("filterWorkshop").value;
    const lineKey = document.getElementById("filterLine").value.trim().toLowerCase();
    const eqKey = document.getElementById("filterEqName").value.trim().toLowerCase();

    let filterData = [...dataList];
    if(wsKey) filterData = filterData.filter(d=>d.workshop === wsKey);
    if(lineKey) filterData = filterData.filter(d=>d.line.toLowerCase().includes(lineKey));
    if(eqKey) filterData = filterData.filter(d=>d.name.toLowerCase().includes(eqKey));

    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    let sumAvail = 0, sumPerf=0, sumQual=0, sumOEE=0;
    filterData.forEach((item,idx)=>{
        const calc = calcSingle(item);
        sumAvail += parseFloat(calc.availRate);
        sumPerf += parseFloat(calc.perfRate);
        sumQual += parseFloat(calc.qualRate);
        sumOEE += parseFloat(calc.oeeVal);
        const oeeCls = getOeeClass(calc.oeeVal);

        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td><span class="link" onclick="delRow(${dataList.indexOf(item)})">删除</span></td>
            <td>${item.workshop}</td>
            <td>${item.line}</td>
            <td>${item.code}</td>
            <td>${item.name}</td>
            <td>${item.model}</td>
            <td><input type="number" value="${item.planHour}" onchange="updateData(${dataList.indexOf(item)},'planHour',Number(this.value))"></td>
            <td><input type="number" value="${item.runningHour}" onchange="updateData(${dataList.indexOf(item)},'runningHour',Number(this.value))"></td>
            <td><input type="number" value="${item.total}" onchange="updateData(${dataList.indexOf(item)},'total',Number(this.value))"></td>
            <td><input type="number" value="${item.good}" onchange="updateData(${dataList.indexOf(item)},'good',Number(this.value))"></td>
            <td><input type="number" value="${item.takt}" onchange="updateData(${dataList.indexOf(item)},'takt',Number(this.value))"></td>
            <td>${calc.availRate}</td>
            <td>${calc.perfRate}</td>
            <td>${calc.qualRate}</td>
            <td class="${oeeCls}">${calc.oeePercent}</td>
        `;
        tbody.appendChild(tr);
    })

    // 更新统计卡片
    const len = filterData.length;
    document.getElementById("totalDevice").innerText = len;
    document.getElementById("avgAvail").innerText = len>0 ? (sumAvail/len).toFixed(2)+"%" : "0%";
    document.getElementById("avgPerf").innerText = len>0 ? (sumPerf/len).toFixed(2)+"%" : "0%";
    document.getElementById("avgQual").innerText = len>0 ? (sumQual/len).toFixed(2)+"%" : "0%";
    document.getElementById("avgOEE").innerText = len>0 ? (sumOEE/len).toFixed(2)+"%" : "0%";
}

// 修改单元格数据
function updateData(index,key,val){
    dataList[index][key] = val;
    saveLocal();
    renderTable();
}

// 新增设备行
function addRow(){
    dataList.push({
        workshop:"SMT车间",line:"A线",code:"NEW-001",name:"新设备",model:"",
        planHour:8,runningHour:8,total:0,good:0,takt:10
    });
    saveLocal();
    renderTable();
}

// 删除行
function delRow(idx){
    if(!confirm("确认删除该设备记录？")) return;
    dataList.splice(idx,1);
    saveLocal();
    renderTable();
}

// 本地存储
function saveLocal(){
    localStorage.setItem('oeeDeviceData',JSON.stringify(dataList));
}

// 重置筛选条件
function resetFilter(){
    document.getElementById("filterWorkshop").value = "";
    document.getElementById("filterLine").value = "";
    document.getElementById("filterEqName").value = "";
    renderTable();
}

// 恢复初始全部设备数据
function resetInitData(){
    if(!confirm("确定恢复原始设备清单，当前录入数据会清空？")) return;
    dataList = JSON.parse(JSON.stringify(initDeviceList));
    saveLocal();
    renderTable();
}

// 导出CSV
function exportCsv(){
    let csv = "车间,线体,设备编号,设备名称,型号,计划工时(h),实际工时(h),总产量,良品数,理论节拍(s),可用率,性能率,良品率,OEE\n";
    dataList.forEach(item=>{
        const c = calcSingle(item);
        csv += `${item.workshop},${item.line},${item.code},${item.name},${item.model},${item.planHour},${item.runningHour},${item.total},${item.good},${item.takt},${c.availRate},${c.perfRate},${c.qualRate},${c.oeePercent}\n`;
    })
    const blob = new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "OEE设备统计表_"+new Date().toLocaleDateString()+".csv";
    a.click();
    URL.revokeObjectURL(url);
}

window.onload = function(){
    renderTable();
}
</script>
