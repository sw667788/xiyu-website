            background-color: #f5f7fa;
            color: #333;
        }
        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        /* 状态标签样式 */
        .status-running {
            background-color: #10b981;
            color: white;
        }
        .status-standby {
            background-color: #f59e0b;
            color: white;
        }
        .status-fault {
            background-color: #ef4444;
            color: white;
        }
        .status-offline {
            background-color: #6b7280;
            color: white;
        }
        /* 卡片悬浮效果 */
        .card-hover {
            transition: all 0.3s ease;

            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        /* 告警闪烁动画 */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }

            animation: blink 1s infinite;

        // 渲染设备表格
        function renderDeviceTable(devices) {
            const tbody = document.getElementById('deviceTable');
            tbody.innerHTML = '';
            
            devices.forEach(device => {
                const statusClass = `status-${device.status}`;
                const statusText = {
                    'running': '运行中',
                    'standby': '待机',
                    'fault': '故障',
                    'offline': '离线'
                }[device.status];

                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50 transition-colors';
                row.innerHTML = `
                    <td class="px-4 py-3">
                        <div class="font-medium text-gray-800">${device.name}</div>
                        <div class="text-xs text-gray-500">${device.model}</div>
                    </td>
                    <td class="px-4 py-3 text-sm text-gray-600">${device.location}</td>
                    <td class="px-4 py-3 text-sm text-gray-600">${device.ratedPower} kW</td>
                    <td class="px-4 py-3 text-sm font-medium ${device.realTimePower > 0 ? 'text-green-600' : 'text-gray-500'}">${device.realTimePower} kW</td>
                    <td class="px-4 py-3 text-sm text-gray-600">${device.runHours.toFixed(1)} h</td>
                    <td class="px-4 py-3 text-sm text-gray-600">${device.dailyEnergy.toFixed(1)} kWh</td>

                        <span class="px-2 py-1 text-xs rounded-full ${statusClass}">${statusText}</span>

                    <td class="px-4 py-3">

            });

        // 渲染能耗趋势图表
        function renderEnergyTrendChart() {
            const chartDom = document.getElementById('energyTrendChart');
            const myChart = echarts.init(chartDom);
            
            // 生成24小时时间轴
            const hours = Array.from({length: 24}, (_, i) => `${i.toString().padStart(2, '0')}:00`);
            // 模拟当日能耗数据
            const energyData = [
                120, 110, 105, 100, 95, 100, 110, 130, 180, 220, 240, 250,
                240, 230, 240, 250, 260, 250, 240, 220, 200, 180, 150, 130
            ];

            const option = {
                tooltip: {
                    trigger: 'axis',
                    formatter: '{b}: {c} kWh'
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: hours,
                    axisLabel: {
                        fontSize: 10,
                        rotate: 45
                    }
                },
                yAxis: {
                    type: 'value',
                    name: '能耗 (kWh)',
                    nameTextStyle: {
                        fontSize: 12
                    }
                },
                series: [{
                    name: '当日能耗',
                    type: 'line',
                    data: energyData,
                    smooth: true,
                    symbol: 'circle',
                    symbolSize: 4,
                    lineStyle: {
                        color: '#3b82f6'
                    },
                    areaStyle: {
                        color: {
                            type: 'linear',
                            x: 0,
                            y: 0,
                            x2: 0,
                            y2: 1,
                            colorStops: [{
                                offset: 0, color: 'rgba(59, 130, 246, 0.3)'
                            }, {
                                offset: 1, color: 'rgba(59, 130, 246, 0.05)'
                            }]
                        }
                    }
                }]
            };

            myChart.setOption(option);
            
            // 窗口大小变化时自适应
            window.addEventListener('resize', () => {
                myChart.resize();
            });
        }

            const chartDom = document.getElementById('energyPieChart');

            const energyData = deviceList
                .filter(device => device.dailyEnergy > 0)
                .map(device => ({
                    name: device.name,
                    value: device.dailyEnergy
                }));

            const option = {
                tooltip: {
                    trigger: 'item',
                    formatter: '{a} <br/>{b}: {c} kWh ({d}%)'
                },
                legend: {
                    orient: 'vertical',
                    left: 'left',
                    top: 'center',
                    textStyle: {
                        fontSize: 10
                    }
                },
                series: [{
                    name: '设备能耗',
                    type: 'pie',
                    radius: ['40%', '70%'],
                    center: ['60%', '50%'],
                    avoidLabelOverlap: false,
                    label: {
                        show: false,
                        position: 'center'
                    },
                    emphasis: {
                        label: {
                            show: true,
                            fontSize: '16',
                            fontWeight: 'bold'
                        }
                    },
                    labelLine: {
                        show: false
                    },
                    data: energyData
                }]
            };

            myChart.setOption(option);
            
            window.addEventListener('resize', () => {
                myChart.resize();
            });
        }

        // 更新核心指标
        function updateCoreMetrics() {
            const runningCount = deviceList.filter(d => d.status === 'running').length;
            const totalPower = deviceList.reduce((sum, d) => sum + d.realTimePower, 0);
            const dailyEnergy = deviceList.reduce((sum, d) => sum + d.dailyEnergy, 0);

            document.getElementById('runningCount').textContent = runningCount;
            document.getElementById('totalPower').textContent = totalPower.toFixed(2);
            document.getElementById('dailyEnergy').textContent = dailyEnergy.toFixed(1);
            document.getElementById('lastUpdate').textContent = new Date().toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        // 实时数据更新
        function startRealTimeUpdate() {
            setInterval(() => {
                // 模拟实时功率波动
                deviceList.forEach(device => {
                    if (device.status === 'running') {
                        const fluctuation = (Math.random() - 0.5) * 2; // ±1kW波动
                        device.realTimePower = Math.max(0, Math.min(device.ratedPower, device.realTimePower + fluctuation));
                        // 运行时长每分钟增加0.01小时（约36秒）
                        device.runHours += 0.01;
                        // 当日能耗同步更新
                        device.dailyEnergy = device.realTimePower * device.runHours;
                    }
                });

                // 更新表格和指标
                renderDeviceTable(deviceList);
                updateCoreMetrics();

                // 模拟异常告警
                const faultDevice = deviceList.find(d => d.status === 'fault');
                if (faultDevice) {
                    showAlarm(`设备【${faultDevice.name}】处于故障状态，请及时处理`);
                }
            }, 1000); // 每秒更新一次
        }

        // 设备筛选
        function filterDevices(status) {
            let filteredDevices = status === 'all' ? deviceList : deviceList.filter(d => d.status === status);
            renderDeviceTable(filteredDevices);
        }

        // 显示设备详情（右侧卡片）
        function showDeviceDetail(deviceId) {
            const device = deviceList.find(d => d.id === deviceId);
            if (!device) return;

            const detailDiv = document.getElementById('deviceDetail');
            const statusText = {
                'running': '运行中',
                'standby': '待机',
                'fault': '故障',
                'offline': '离线'
            }[device.status];

            detailDiv.innerHTML = `
                <div class="space-y-3">
                    <div class="flex justify-between">
                        <span class="text-gray-500">设备名称：</span>
                        <span class="font-medium">${device.name}</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-500">设备型号：</span>
                        <span class="font-medium">${device.model}</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-500">设备编号：</span>
                        <span class="font-medium">${device.code}</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-500">安装位置：</span>
                        <span class="font-medium">${device.location}</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-500">额定功率：</span>
                        <span class="font-medium">${device.ratedPower} kW</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-500">实时功率：</span>
                        <span class="font-medium ${device.realTimePower > 0 ? 'text-green-600' : 'text-gray-500'}">${device.realTimePower} kW</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-500">运行时长：</span>
                        <span class="font-medium">${device.runHours.toFixed(1)} h</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-500">当日能耗：</span>
                        <span class="font-medium">${device.dailyEnergy.toFixed(1)} kWh</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-500">设备状态：</span>
                        <span class="px-2 py-1 text-xs rounded-full status-${device.status}">${statusText}</span>
                    </div>
                    <div class="pt-2 border-t border-gray-200">
                        <p class="text-gray-500 mb-1">能耗特征：</p>
                        <p class="text-gray-700">${device.remark}</p>
                    </div>
                </div>
            `;
        }

        // 显示设备详情弹窗
        function showDeviceModal(deviceId) {
            const device = deviceList.find(d => d.id === deviceId);
            if (!device) return;

            const modal = document.getElementById('deviceModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalContent = document.getElementById('modalContent');
            
            modalTitle.textContent = `设备详情 - ${device.name}`;
            
            const statusText = {
                'running': '运行中',
                'standby': '待机',
                'fault': '故障',
                'offline': '离线'
            }[device.status];

            modalContent.innerHTML = `
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-3">
                        <div class="flex justify-between">
                            <span class="text-gray-500">设备名称：</span>
                            <span class="font-medium">${device.name}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-500">设备型号：</span>
                            <span class="font-medium">${device.model}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-500">设备编号：</span>
                            <span class="font-medium">${device.code}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-500">安装位置：</span>
                            <span class="font-medium">${device.location}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-500">额定功率：</span>
                            <span class="font-medium">${device.ratedPower} kW</span>
                        </div>
                    </div>
                    <div class="space-y-3">
                        <div class="flex justify-between">
                            <span class="text-gray-500">实时功率：</span>
                            <span class="font-medium ${device.realTimePower > 0 ? 'text-green-600' : 'text-gray-500'}">${device.realTimePower} kW</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-500">运行时长：</span>
                            <span class="font-medium">${device.runHours.toFixed(1)} h</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-500">当日能耗：</span>
                            <span class="font-medium">${device.dailyEnergy.toFixed(1)} kWh</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-500">日均运行时长：</span>
                            <span class="font-medium">${device.dailyRunTime} h</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-500">设备状态：</span>
                            <span class="px-2 py-1 text-xs rounded-full status-${device.status}">${statusText}</span>
                        </div>
                    </div>
                </div>
                <div class="pt-4 border-t border-gray-200">
                    <h4 class="font-medium text-gray-800 mb-2">能耗特征说明</h4>
                    <p class="text-gray-700">${device.remark}</p>
                </div>
                <div class="pt-4 border-t border-gray-200 flex justify-end space-x-2">
                    <button class="px-4 py-2 text-sm bg-gray-100 text-gray-600 rounded-md hover:bg-gray-200 transition-colors" onclick="closeModal()">关闭</button>
                    <button class="px-4 py-2 text-sm bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors" onclick="exportDeviceData(${device.id})">导出数据</button>
                </div>
            `;
            
            modal.classList.remove('hidden');
        }

        // 关闭弹窗
        function closeModal() {
            document.getElementById('deviceModal').classList.add('hidden');
        }

        // 显示告警
        function showAlarm(content) {
            const alarmPanel = document.getElementById('alarmPanel');
            const alarmContent = document.getElementById('alarmContent');
            alarmContent.textContent = content;
            alarmPanel.classList.remove('hidden');
        }

        // 隐藏告警
        function hideAlarm() {
            document.getElementById('alarmPanel').classList.add('hidden');
        }

        // 导出设备数据（模拟）
        function exportDeviceData(deviceId) {
            const device = deviceList.find(d => d.id === deviceId);
            if (!device) return;
            
            alert(`已导出设备【${device.name}】的运行数据`);
            closeModal();
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initPage);

        // 点击弹窗外部关闭
        document.getElementById('deviceModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                closeModal();
            }
        });
    </script>
</body>
</html>
